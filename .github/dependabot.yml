version: 2
# 依赖只由**根 lock 一份**描述（仓库是 npm workspaces，三个包跟着根 lock 走），
# 故 npm 只需一个条目；分四个目录各一条会让同一依赖出现多份互相打架的 PR。
#
# 前缀用 fix(deps) 而非 chore(deps)：release-please 只把 feat/fix/perf/revert 当
# 「用户可见」，chore 一律 hidden ⇒ 用 chore 的依赖升级既进不了 CHANGELOG、也不 bump 版本，
# 安全修复会静默留在 main 上不随产物发出。开发工具（Biome/oxlint 这类）的升级不改变交付物，
# 但**统一分组**把它们并成每周至多一个 PR ⇒ 至多切一个 patch 版本，不会「每升一次格式化器
# 就发一次版」；要避免这次 patch，把它与下一个 fix/feat 一起合即可。
#
# `vitest` 与 `@vitest/coverage-v8` 是**已知无法自动化的例外**：一律 ignore，由维护者成对升级。
# 根因是 peer 需求**不对称**：`@vitest/coverage-v8` 把 vitest 钉成精确同版（非 optional，
# 实测 5.0.3 的 peerDependencies = {vitest: "5.0.3"}），而 `vitest` 对 `@vitest/coverage-v8`
# 只是 optional peer。dependabot 据此认为「单独升 vitest 不违反 peer」，于是只提 vitest、
# 丢掉同伴，而 `npm ci` 时同伴那条精确 peer 立刻 ERESOLVE。
# 实测记录：独立 PR（#594/#595/#598/#600 四条）+ 加了 `vitest` 分组之后（#605/#606 两条）
# **六条全红** —— 分组救不了它，因为分组只合并「各自都能更新成功的条目」，而 coverage-v8
# 单独升必然违反 peer，于是永远进不了组。版本选择还受默认 3 天 cooldown 影响：#605 创建时
# 5.0.3 才发布 21 小时仍在冷却期，dependabot 只能退选**装不上**的 5.0.2（npm arborist 空指针，
# 非本机问题）。故不再折腾分组配置，直接登记为例外。
#
# 升级步骤：把三包 package.json 的这两个依赖**同时**写到目标版本（`^` 或精确版都行，
# 但三者必须一致），在仓库根跑一次
# `npm install --registry=https://registry.npmjs.org`（根 lock 一份即覆盖三包），
# 再跑 `bash tools/ci/local-check.sh`。
updates:
  # 唯一的 npm 条目：workspace 根（根 lock 覆盖 apps/web · apps/server · apps/schemas）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: auto
    commit-message:
      prefix: "fix(deps)"
    # vitest 与其 coverage 同伴由维护者成对升级（见文件头说明），不交给 dependabot
    ignore:
      - dependency-name: "vitest"
      - dependency-name: "@vitest/coverage-v8"
      # dompurify 是 monaco-editor 的传递依赖，而 monaco-editor 最新版仍精确锁 3.4.15
      # ⇒ 无修复版可升，安全更新作业只会反复失败。两条告警都要求 IN_PLACE 模式，monaco
      # 从不启用（仅 `IN_PLACE = cfg.IN_PLACE || false`，整包 0 处 IN_PLACE: true）⇒ 不可达，
      # 已按 not_used 处置；等 monaco-editor 升级带上新版 dompurify 后移除本条。
      - dependency-name: "dompurify"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    rebase-strategy: auto
    commit-message:
      prefix: "chore(ci)"
    groups:
      # actions 版本号即 semver，major（如 cache v4→v6）与小版本同组合并，
      # 拆分意义不大；如某 action 需要谨慎升级，用 exclude-patterns 排除
      actions-all:
        patterns: ["*"]
