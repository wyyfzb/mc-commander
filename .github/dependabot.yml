version: 2
# 会进 tarball 的 npm 包（mc_commander_server / mc_manager_web / mc-schemas）用 fix(deps) 而非
# chore(deps)：release-please 只把 feat/fix/perf/revert 当「用户可见」，chore/docs/ci 等一律
# hidden ⇒ 用 chore 前缀的依赖升级既进不了 CHANGELOG、也不 bump 版本，安全修复会静默留在
# main 上不随产物发出。这些包的依赖升级会实际改变交付物（前端产物由 release.yml 的 cp 阶段
# 并入 public/），故属 fix 语义。
# 两处例外，均**有意**保持 chore：仓库根工具包（只有 devDependencies、不进 tarball，
# 不该让每次格式化器升级都切一个 patch 版本）与 github-actions（只影响 CI 自身）。
#
# `vitest` 与 `@vitest/coverage-v8` 是**已知无法自动化的例外**：三包一律 ignore，
# 由维护者成对升级（两者必须改成同一个版本号并重新生成 lock）。
#
# 根因是 peer 需求**不对称**：`@vitest/coverage-v8` 把 vitest 钉成精确同版（非 optional，
# 实测 5.0.3 的 peerDependencies = {vitest: "5.0.3"}），而 `vitest` 对 `@vitest/coverage-v8`
# 只是 optional peer。dependabot 据此认为「单独升 vitest 不违反 peer」，于是只提 vitest、
# 丢掉同伴，而 `npm ci` 时同伴那条精确 peer 立刻 ERESOLVE。
# 实测记录：独立 PR（#594/#595/#598/#600 四条）+ 加了 `vitest` 分组之后（#605/#606 两条）
# **六条全红** —— 分组救不了它，因为分组只合并「各自都能更新成功的条目」，而 coverage-v8
# 单独升必然违反 peer，于是永远进不了组。版本选择还受默认 3 天 cooldown 影响：#605 创建时
# 5.0.3 才发布 21 小时仍在冷却期，dependabot 只能退选**装不上**的 5.0.2（npm arborist 空指针，
# 非本机问题）。故不再折腾分组配置，直接登记为例外。
#
# 升级步骤：把三包 package.json 的这两个依赖**同时**写到目标版本（用 `^` 或精确版都行，
# 但两者必须一致），再各自 `npm install --registry=https://registry.npmjs.org` 重新生成 lock，
# 最后跑 `bash scripts/local-check.sh`。
updates:
  - package-ecosystem: npm
    directory: /mc_commander_server
    schedule:
      interval: weekly
    rebase-strategy: auto
    commit-message:
      prefix: "fix(deps)"
    # vitest 与其 coverage 同伴由维护者成对升级（见文件头说明），不交给 dependabot
    ignore:
      - dependency-name: "vitest"
      - dependency-name: "@vitest/coverage-v8"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mc_manager_web
    schedule:
      interval: weekly
    rebase-strategy: auto
    commit-message:
      prefix: "fix(deps)"
    # jsdom 钉在 30.0.1：30.1.x 用 `implForWrapperWithInterface` + interface descriptor
    # 替换了旧的 `exports.is(this)` 品牌校验，而 msw 的 @mswjs/interceptors 在
    # `recordRawHeaders` 里迭代 FormData 时会走到未初始化的 impl 上，抛
    # `TypeError: Cannot read properties of undefined (reading '_buffer')`——
    # 前端 11 条 XHR 上传测试（apiUploadFile 路径）全崩。实测拦阻手段无效：
    # 把 @mswjs/interceptors 升到最新 0.45.6 仍崩（问题在 jsdom 侧）；
    # 30.1.1 已是 jsdom 最新版，故只能钉版等上游适配。
    ignore:
      - dependency-name: "jsdom"
        versions: [">=30.1.0"]
    # vitest 与其 coverage 同伴由维护者成对升级（见文件头说明），不交给 dependabot
    ignore:
      - dependency-name: "vitest"
      - dependency-name: "@vitest/coverage-v8"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # 仓库根工具包（只装代码格式化器 Biome）：漏掉本目录会让格式化器长期停在旧版本，
  # 与 CI 的 format job 及各贡献者的本地输出产生版本漂移。
  # 前缀保持 chore(deps) 与前三个包不同，是**有意为之**：本包只有 devDependencies、
  # 不进 tarball（release.yml 的 staging 只取 mc_commander_server + mc-schemas），
  # 按「devDependencies 不进产物 ⇒ 不算上线风险」的既有口径（见 ci.yml 的依赖门禁注释），
  # 它不该触发发版——否则每升一次格式化器都要切一个 patch 版本。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # 契约包同样独立安装依赖，其 dist 是服务端运行时消费物：漏掉本目录会让
  # zod 长期停在旧版本，而两边 schema 行为差异只在运行期暴露
  - package-ecosystem: npm
    directory: /mc-schemas
    schedule:
      interval: weekly
    rebase-strategy: auto
    commit-message:
      prefix: "fix(deps)"
    # vitest 与其 coverage 同伴由维护者成对升级（见文件头说明），不交给 dependabot
    ignore:
      - dependency-name: "vitest"
      - dependency-name: "@vitest/coverage-v8"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    rebase-strategy: auto
    commit-message:
      prefix: "chore(ci)"
    groups:
      # actions 版本号即 semver，major（如 cache v4→v6）与小版本同组合并，
      # 拆分意义不大；如某 action 需要谨慎升级，用 exclude-patterns 排除
      actions-all:
        patterns: ["*"]
