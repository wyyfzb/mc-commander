version: 2
updates:
  - package-ecosystem: npm
    directory: /mc_commander_server
    schedule:
      interval: weekly
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mc_manager_web
    schedule:
      interval: weekly
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # 仓库根工具包（只装代码格式化器 Biome）：漏掉本目录会让格式化器长期停在旧版本，
  # 与 CI 的 format job 及各贡献者的本地输出产生版本漂移
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # 契约包同样独立安装依赖，其 dist 是服务端运行时消费物：漏掉本目录会让
  # zod 长期停在旧版本，而两边 schema 行为差异只在运行期暴露
  - package-ecosystem: npm
    directory: /mc-schemas
    schedule:
      interval: weekly
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    rebase-strategy: auto
    commit-message:
      prefix: "chore(ci)"
    groups:
      # actions 版本号即 semver，major（如 cache v4→v6）与小版本同组合并，
      # 拆分意义不大；如某 action 需要谨慎升级，用 exclude-patterns 排除
      actions-all:
        patterns: ["*"]
