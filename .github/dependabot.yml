version: 2
updates:
  - package-ecosystem: npm
    directory: /mc_commander_server
    schedule:
      interval: weekly
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mc_manager_web
    schedule:
      interval: weekly
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    rebase-strategy: auto
    commit-message:
      prefix: "chore(ci)"
    groups:
      # actions 版本号即 semver，major（如 cache v4→v6）与小版本同组合并，
      # 拆分意义不大；如某 action 需要谨慎升级，用 exclude-patterns 排除
      actions-all:
        patterns: ["*"]
