version: 2
# 会进 tarball 的 npm 包（mc_commander_server / mc_manager_web / mc-schemas）用 fix(deps) 而非
# chore(deps)：release-please 只把 feat/fix/perf/revert 当「用户可见」，chore/docs/ci 等一律
# hidden ⇒ 用 chore 前缀的依赖升级既进不了 CHANGELOG、也不 bump 版本，安全修复会静默留在
# main 上不随产物发出。这些包的依赖升级会实际改变交付物（前端产物由 release.yml 的 cp 阶段
# 并入 public/），故属 fix 语义。
# 两处例外，均**有意**保持 chore：仓库根工具包（只有 devDependencies、不进 tarball，
# 不该让每次格式化器升级都切一个 patch 版本）与 github-actions（只影响 CI 自身）。
#
# 为什么三个包都多一个 `vitest` 分组：`@vitest/coverage-v8` 的 peer 锁死**同版** vitest
# （实测 5.0.2 的 peerDependencies = {vitest: "5.0.2"}），而 dependabot 默认把每个依赖
# 单独开 PR，于是单独升 vitest 或单独升 coverage-v8 都会在 `npm ci` 阶段 ERESOLVE——
# 两边都红，谁先合都堵死（实测 #594/#595/#598/#600 四条全因此红）。
# 放进同一分组后二者在同一 PR 内同步升版，peer 才满足。分组按「先匹配到的先用」，
# 故 vitest 组必须排在 minor-and-patch 之前；且**不限 update-types**——
# 正是 major（4→5）才触发了这个死锁。
updates:
  - package-ecosystem: npm
    directory: /mc_commander_server
    schedule:
      interval: weekly
    rebase-strategy: auto
    commit-message:
      prefix: "fix(deps)"
    groups:
      # vitest 与其 coverage 同伴必须同 PR 升版（见文件头说明）
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mc_manager_web
    schedule:
      interval: weekly
    rebase-strategy: auto
    commit-message:
      prefix: "fix(deps)"
    groups:
      # vitest 与其 coverage 同伴必须同 PR 升版（见文件头说明）
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        update-types: [minor, patch]

  # 仓库根工具包（只装代码格式化器 Biome）：漏掉本目录会让格式化器长期停在旧版本，
  # 与 CI 的 format job 及各贡献者的本地输出产生版本漂移。
  # 前缀保持 chore(deps) 与前三个包不同，是**有意为之**：本包只有 devDependencies、
  # 不进 tarball（release.yml 的 staging 只取 mc_commander_server + mc-schemas），
  # 按「devDependencies 不进产物 ⇒ 不算上线风险」的既有口径（见 ci.yml 的依赖门禁注释），
  # 它不该触发发版——否则每升一次格式化器都要切一个 patch 版本。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # 契约包同样独立安装依赖，其 dist 是服务端运行时消费物：漏掉本目录会让
  # zod 长期停在旧版本，而两边 schema 行为差异只在运行期暴露
  - package-ecosystem: npm
    directory: /mc-schemas
    schedule:
      interval: weekly
    rebase-strategy: auto
    commit-message:
      prefix: "fix(deps)"
    groups:
      # vitest 与其 coverage 同伴必须同 PR 升版（见文件头说明）
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    rebase-strategy: auto
    commit-message:
      prefix: "chore(ci)"
    groups:
      # actions 版本号即 semver，major（如 cache v4→v6）与小版本同组合并，
      # 拆分意义不大；如某 action 需要谨慎升级，用 exclude-patterns 排除
      actions-all:
        patterns: ["*"]
