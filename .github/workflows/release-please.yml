# Release Please（发版流程自动化）

# 解析 main 上 Conventional Commits（fix→patch / feat→minor / !→major），
# 维护一个 Release PR（bump 三包 version + lock + README + 生成 CHANGELOG.md；
# 三包同步靠 release-please-config.json 的 extra-files 登记）。
# 合并 Release PR 后 **release-please 自动打 vX.Y.Z tag 并建 GitHub Release**；
# 但 GITHUB_TOKEN 打的 tag 不触发 push 事件，故 release.yml 不会自动跑——
# 需从 main 手动 dispatch `release.yml` 并传 tag 名补跑（见该文件的 workflow_dispatch）。
# Release PR 由 GITHUB_TOKEN 开启，按 GitHub 防循环机制不触发 CI，
# 属机械 bump 提交，豁免交叉审查；合并该 PR 即代表发版确认（人工实测是合并前的硬性 gate）。
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
