# Release Please（发版流程自动化）

# 解析 main 上 Conventional Commits（fix→patch / feat→minor；breaking 在 0.x 期亦只 minor，
# 由 release-please-config.json 的 bump-minor-pre-major 决定，上线转 1.x 时再撤该键），
# 维护一个 Release PR（bump 三包 version + lock + README + 生成 CHANGELOG.md；
# 三包同步靠 release-please-config.json 的 extra-files 登记，CHANGELOG 落仓库根
# 由该配置的 changelog-path 指定——只移文件不改配置会让它按默认路径在包内重建一份）。
#
# packages 键必须是仓库根 "."（而非某个子包）：release-please 只在 path === '.' 时
# 把「全部提交」都算进来（manifest 的 ROOT_PROJECT_PATH 旁路，非根路径则按目录过滤提交），
# 子包路径会按目录过滤提交。曾用 mc_commander_server 作键，导致「只改前端/契约包的提交」
# 被整条丢弃——#582（前端依赖修复）因此从未进入 CHANGELOG、也从未发版，而它的产物其实会
# 打进 tarball（见下方构建步骤）。改用根键后：全仓任一改动都能触发发版，三包版本元数据由
# extra-files 同步 bump，与 release.yml 的「tag ↔ 三包 version 一致」校验保持同一步调。
# 策略取 simple 而非 node：根 package.json 是无 version 的私有工具包，node 策略会原生
# 读写它并凭空注入 version 字段（多出两个与发版无关的文件）。
#
# 合并 Release PR 后 release-please 自动打 vX.Y.Z tag 并建 GitHub Release，
# 产物构建由本工作流同 run 的 build-and-publish job 接续完成（release.yml 双入口之一）。
#
# draft + force-tag-creation 必须同时开启：GitHub 对 draft release 采取 lazy tag creation，
# 直到发布才建 Git tag，release-please 会因此找不到上一个 release 而算错 CHANGELOG 版本区间，
# 后续 job 也无法按 tag checkout。force-tag-creation 走 git.createRef 显式建 tag 补上这一环。
# 产物上传到 draft（不受 immutable 约束）后由该 job 末尾显式发布，此刻才转为不可变。
#
# Release PR 的 CI 需要先人工批准才会跑：其 head 提交由 github-actions[bot] 创建，
# 公开仓库把非本人 actor 的 run 停在 action_required（0 个 job、0 个 check-run），
# 此时 PR 因缺必需检查而 BLOCKED。批准后才开始跑：
#   gh api --method POST repos/<owner>/<repo>/actions/runs/<run_id>/approve
# （把 main 合并进该分支——GitHub UI 的 Update branch——会让 head 变成本人提交，
#  那时 CI 直接就跑，实测 v0.5.0 的 #567 即此路径；两条路都通。）
name: Release Please

on:
  push:
    branches: [main]

# 串行化：main 上连续推送会让多轮 run 抢同一个 Release PR / release
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # 输出名与 release-please-config.json 的 packages 键绑定：setPathOutput() 仅在 path === '.'
      # 时才输出不带前缀的 release_created / tag_name，非 root 包一律加 `<path>--` 前缀。
      # 本仓库 packages 键现为根键 "."（见文件头说明），故 tag 名直接取无前缀的 tag_name。
      # releases_created 是全局输出（不带头缀），任何包建了发布都为 true，可用于门禁判断。
      release_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # 输出名与 packages 键是隐式耦合，改任一侧不同步就会让上面的 tag_name 取空值，
      # 进而使 build-and-publish 被静默跳过——发布照常落一个零资产 draft，且无任何失败日志。
      # 故在这里把「发布了却取不到 tag」变成显式失败
      - name: 校验发布输出可用
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASES_CREATED: ${{ steps.release.outputs.releases_created }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "::error::release-please 报告已创建发布，但未取到 tag 名。"
            echo "::error::输出名与本仓库的 packages 键绑定：根键 '.' 用无前缀 tag_name，子包用 <path>--tag_name。请核对 release-please-config.json 的 packages 键与上一处 outputs 声明是否一致。"
            exit 1
          fi
          echo "发布输出就绪: releases_created=$RELEASES_CREATED tag=$TAG_NAME"

  # Release PR 合并这一轮才创建 release；其余轮次 releases_created 为 'false'，直接跳过。
  # 产物逻辑复用 release.yml，正常路径与手动补跑同一条实现。
  build-and-publish:
    name: 构建并发布产物
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
