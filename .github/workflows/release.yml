name: Release

# 三个入口共用下方同一套构建逻辑：
#   workflow_call  —— release-please.yml 同 run 调用的正常路径
#   push: tags     —— 人工直接推 tag（release-please 的 tag 由 API 创建，不触发 push 事件）
#   workflow_dispatch —— 补跑兜底：某个 tag 的产物没构建成功时，从 main 手动指定 tag 重跑
# 产物名固定为 mc-commander-server.tar.gz（不含 tag），使 releases/latest/download/<asset>
# 可用，部署脚本因而能把默认版本设为 latest 而无需预知 tag。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '补跑的 tag 名（如 v0.6.0），必须已存在且与三包 version 一致。仅用于该 tag 的产物尚未成功构建时——已发布成功的 tag 在 Immutable Releases 下资产不可覆盖，重跑会失败'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'release-please 本次创建的 tag 名'
        required: true
        type: string

# 双入口 + 重试可能并发打到同一个 release 上；发布动作不可中断，故排队而不取消
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: 构建发布产物
    runs-on: ubuntu-latest
    # TAG_REF：push tag 事件 = tag 名；dispatch / workflow_call 补跑 = 入参 tag
    env:
      TAG_REF: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_REF }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc_manager_web/package-lock.json

      # 版本链校验（发布卫生）：产物 = tag 指向的提交构建，要求 tag → 仓库 → 产物三者一致。
      # 三包由 release-please 的 extra-files 同步 bump，任一侧漂移都会发布出版本号错配的产物，
      # 故在构建前即中止
      - name: 校验 tag 与三包 version 一致
        env:
          REF_NAME: ${{ env.TAG_REF }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const expect = process.env.REF_NAME.replace(/^v/, '');
          const paths = [
            'mc_commander_server/package.json',
            'mc_manager_web/package.json',
            'mc-schemas/package.json',
          ];
          const bad = paths.filter((p) => JSON.parse(fs.readFileSync(p, 'utf8')).version !== expect);
          if (bad.length) {
            console.error(`版本链不一致：tag=${process.env.REF_NAME}，三包 version 应为 ${expect}`);
            bad.forEach((p) => console.error(`  ${p}: ${JSON.parse(fs.readFileSync(p, 'utf8')).version}`));
            console.error(`请先 bump 三包 version 至 ${expect} 并合并，再打 tag ${process.env.REF_NAME}`);
            process.exit(1);
          }
          console.log(`版本链校验通过: tag ${process.env.REF_NAME} ↔ 三包 version ${expect}`);
          EOF

      # 前端构建 → 产物进入服务端 public/（同源托管）
      - name: 构建前端
        working-directory: mc_manager_web
        run: |
          npm ci
          npm run build

      - name: 打包服务端（含前端产物）
        working-directory: mc_commander_server
        run: |
          npm ci --omit=dev
          mkdir -p public
          cp -r ../mc_manager_web/dist/* public/

      # 共享契约包 dist 随仓库跟踪，发布前仍强制重建，防止 src/dist 漂移进入发布产物
      - name: 构建共享契约包
        working-directory: mc-schemas
        run: |
          npm ci
          npm run build

      # @mc-commander/schemas 以 file:../mc-schemas 引用，位于服务端目录之外，
      # 直接打包会产出「安装全绿但启动即崩」的悬空依赖 tarball（npm ci 静默建死链）。
      # 组装 staging：内联 mc-schemas 完整包（源码 + dist），并把 package.json /
      # package-lock.json 中的依赖路径同步重写为 tarball 内相对引用 file:./mc-schemas
      - name: 组装发布 staging（内联共享契约包）
        run: |
          rm -rf .staging
          mkdir -p .staging
          tar -cf - -C mc_commander_server \
            --exclude=node_modules --exclude=data --exclude=backups --exclude=servers --exclude=.env \
            . | tar -xf - -C .staging
          mkdir -p .staging/mc-schemas
          tar -cf - -C mc-schemas --exclude=node_modules . | tar -xf - -C .staging/mc-schemas
          node <<'EOF'
          const fs = require('fs');
          const pkgPath = '.staging/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          if (pkg.dependencies['@mc-commander/schemas'] !== 'file:../mc-schemas') {
            throw new Error('package.json 未命中预期的 file:../mc-schemas 依赖，staging 前提不成立');
          }
          pkg.dependencies['@mc-commander/schemas'] = 'file:./mc-schemas';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          const lockPath = '.staging/package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          const rootDeps = lock.packages && lock.packages[''].dependencies;
          if (!rootDeps || rootDeps['@mc-commander/schemas'] !== 'file:../mc-schemas') {
            throw new Error('package-lock.json 根依赖未命中预期 file:../mc-schemas');
          }
          rootDeps['@mc-commander/schemas'] = 'file:./mc-schemas';
          const linkEntry = lock.packages['node_modules/@mc-commander/schemas'];
          if (!linkEntry || linkEntry.resolved !== '../mc-schemas') {
            throw new Error('package-lock.json 链接条目未命中预期 ../mc-schemas');
          }
          linkEntry.resolved = 'mc-schemas';
          const targetEntry = lock.packages['../mc-schemas'];
          if (!targetEntry) {
            throw new Error('package-lock.json 缺少 file 目标条目 ../mc-schemas');
          }
          delete lock.packages['../mc-schemas'];
          lock.packages['mc-schemas'] = targetEntry;
          delete targetEntry.devDependencies;
          // 内联包按运行时发布物瘦身：npm 对 project 内 file: 目标按内嵌包校验，
          // devDependencies 会参与 lock 同步检查——剥离后与 --omit=dev 安装语义一致
          const vendorPkgPath = '.staging/mc-schemas/package.json';
          const vendorPkg = JSON.parse(fs.readFileSync(vendorPkgPath, 'utf8'));
          delete vendorPkg.devDependencies;
          delete vendorPkg.scripts;
          fs.writeFileSync(vendorPkgPath, JSON.stringify(vendorPkg, null, 2) + '\n');
          fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');
          console.log('依赖路径重写完成: file:../mc-schemas -> file:./mc-schemas');
          EOF

      # 模拟用户解包后的安装流程，防止再次发布「安装全绿但服务无法启动」的产物
      - name: 发布前 sanity check
        run: |
          cd .staging
          npm ci --omit=dev
          node -e "const schemas = require('@mc-commander/schemas'); const keys = Object.keys(schemas); if (!keys.length) throw new Error('schemas 加载为空对象'); console.log('sanity check 通过: @mc-commander/schemas 加载成功，' + keys.length + ' 个导出')"

      # 资产名不含 tag：部署脚本用 releases/latest/download/<asset> 取最新版，
      # 该地址无法预知 tag，故名字必须固定
      - name: 打包 tarball
        run: |
          tar -czf mc-commander-server.tar.gz \
            --exclude=node_modules --exclude=data --exclude=backups --exclude=servers --exclude=.env \
            -C .staging .

      - name: 产物敏感排除自检
        run: |
          LEAKS=$(tar -tzf mc-commander-server.tar.gz | grep -E '(^|/)(node_modules|data|backups|servers|\.env)(/|$)' || true)
          if [ -n "$LEAKS" ]; then
            echo "发现敏感路径进入发布产物："
            echo "$LEAKS"
            exit 1
          fi
          echo '敏感排除自检通过'

      - name: 生成 SHA256SUMS
        run: sha256sum mc-commander-server.tar.gz > SHA256SUMS.txt

      # 发布分三步，顺序不可换：draft 阶段上传（不受 immutable 约束）→ 全部资产就位 → 才发布。
      # 一旦发布，immutable 生效，资产不可增删改；若在资产未齐时发布，这个版本就永久残缺。
      # 正常路径下 release-please 已建好 draft release；补跑路径可能连 release 都没有，先补建。
      - name: 确保 Release 存在
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG_REF" >/dev/null 2>&1; then
            echo "Release $TAG_REF 已存在"
          else
            echo "Release $TAG_REF 不存在，补建 draft"
            gh release create "$TAG_REF" \
              --draft \
              --title "$TAG_REF" \
              --notes "由 release.yml 兜底创建，见 CHANGELOG.md"
          fi

      # --clobber 让重试可覆盖上次半途上传的资产
      - name: 上传产物到 draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG_REF" mc-commander-server.tar.gz SHA256SUMS.txt --clobber

      - name: 发布（draft → published）
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG_REF" --draft=false --latest
