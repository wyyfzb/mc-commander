name: Release

# 三个入口共用下方同一套构建逻辑：
#   workflow_call  —— release-please.yml 同 run 调用的正常路径
#   push: tags     —— 人工直接推 tag（release-please 的 tag 由 API 创建，不触发 push 事件）
#   workflow_dispatch —— 补跑兜底：某个 tag 的产物没构建成功时，从 main 手动指定 tag 重跑
# 产物名固定为 mc-commander-server.tar.gz（不含 tag），使 releases/latest/download/<asset>
# 可用，部署脚本因而能把默认版本设为 latest 而无需预知 tag。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '补跑的 tag 名（如 v0.6.0），必须已存在且与三包 version 一致。仅用于该 tag 的产物尚未成功构建时——已发布成功的 tag 在 Immutable Releases 下资产不可覆盖，重跑会失败'
        required: true
        type: string
      sync_only:
        description: '只同步产物到 Gitee、不重新构建（用于给已发布版本补产物：重跑构建会因 Immutable Releases 失败）'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: 'release-please 本次创建的 tag 名'
        required: true
        type: string
      # 显式声明而非依赖「未声明即空」：正常发版必须构建，声明成 default false 语义明确，
      # 也避免 job 级 if 引用未声明输入时的行为歧义
      sync_only:
        description: '只同步产物到 Gitee、不构建（正常发版恒为 false）'
        required: false
        default: false
        type: boolean

# 双入口 + 重试可能并发打到同一个 release 上；发布动作不可中断，故排队而不取消
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: 构建发布产物
    runs-on: ubuntu-latest
    # sync_only 路径下刻意跳过：给「已发布」的版本补产物时重跑构建会走到
    # gh release upload --clobber，而 Immutable Releases 下已发布资产不可增删改 ⇒ 必然失败。
    # 其余入口（push tag / workflow_call）该输入为空，条件为真，构建照常。
    if: ${{ inputs.sync_only != true }}
    # TAG_REF：push tag 事件 = tag 名；dispatch / workflow_call 补跑 = 入参 tag
    env:
      TAG_REF: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_REF }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc_manager_web/package-lock.json

      # 版本链校验（发布卫生）：产物 = tag 指向的提交构建，要求 tag → 仓库 → 产物三者一致。
      # 三包由 release-please 的 extra-files 同步 bump，任一侧漂移都会发布出版本号错配的产物，
      # 故在构建前即中止
      - name: 校验 tag 与三包 version 一致
        env:
          REF_NAME: ${{ env.TAG_REF }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const expect = process.env.REF_NAME.replace(/^v/, '');
          const paths = [
            'mc_commander_server/package.json',
            'mc_manager_web/package.json',
            'mc-schemas/package.json',
          ];
          const bad = paths.filter((p) => JSON.parse(fs.readFileSync(p, 'utf8')).version !== expect);
          if (bad.length) {
            console.error(`版本链不一致：tag=${process.env.REF_NAME}，三包 version 应为 ${expect}`);
            bad.forEach((p) => console.error(`  ${p}: ${JSON.parse(fs.readFileSync(p, 'utf8')).version}`));
            console.error(`请先 bump 三包 version 至 ${expect} 并合并，再打 tag ${process.env.REF_NAME}`);
            process.exit(1);
          }
          console.log(`版本链校验通过: tag ${process.env.REF_NAME} ↔ 三包 version ${expect}`);
          EOF

      # 前端构建 → 产物进入服务端 public/（同源托管）
      - name: 构建前端
        working-directory: mc_manager_web
        run: |
          npm ci
          npm run build

      - name: 打包服务端（含前端产物）
        working-directory: mc_commander_server
        run: |
          npm ci --omit=dev
          mkdir -p public
          cp -r ../mc_manager_web/dist/* public/

      # 共享契约包 dist 随仓库跟踪，发布前仍强制重建，防止 src/dist 漂移进入发布产物
      - name: 构建共享契约包
        working-directory: mc-schemas
        run: |
          npm ci
          npm run build

      # @mc-commander/schemas 以 file:../mc-schemas 引用，位于服务端目录之外，
      # 直接打包会产出「安装全绿但启动即崩」的悬空依赖 tarball（npm ci 静默建死链）。
      # 组装 staging：内联 mc-schemas 完整包（源码 + dist），并把 package.json /
      # package-lock.json 中的依赖路径同步重写为 tarball 内相对引用 file:./mc-schemas
      - name: 组装发布 staging（内联共享契约包）
        run: |
          rm -rf .staging
          mkdir -p .staging
          tar -cf - -C mc_commander_server \
            --exclude=node_modules --exclude=data --exclude=backups --exclude=servers --exclude=.env \
            . | tar -xf - -C .staging
          mkdir -p .staging/mc-schemas
          tar -cf - -C mc-schemas --exclude=node_modules . | tar -xf - -C .staging/mc-schemas
          node <<'EOF'
          const fs = require('fs');
          const pkgPath = '.staging/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          if (pkg.dependencies['@mc-commander/schemas'] !== 'file:../mc-schemas') {
            throw new Error('package.json 未命中预期的 file:../mc-schemas 依赖，staging 前提不成立');
          }
          pkg.dependencies['@mc-commander/schemas'] = 'file:./mc-schemas';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          const lockPath = '.staging/package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          const rootDeps = lock.packages && lock.packages[''].dependencies;
          if (!rootDeps || rootDeps['@mc-commander/schemas'] !== 'file:../mc-schemas') {
            throw new Error('package-lock.json 根依赖未命中预期 file:../mc-schemas');
          }
          rootDeps['@mc-commander/schemas'] = 'file:./mc-schemas';
          const linkEntry = lock.packages['node_modules/@mc-commander/schemas'];
          if (!linkEntry || linkEntry.resolved !== '../mc-schemas') {
            throw new Error('package-lock.json 链接条目未命中预期 ../mc-schemas');
          }
          linkEntry.resolved = 'mc-schemas';
          const targetEntry = lock.packages['../mc-schemas'];
          if (!targetEntry) {
            throw new Error('package-lock.json 缺少 file 目标条目 ../mc-schemas');
          }
          delete lock.packages['../mc-schemas'];
          lock.packages['mc-schemas'] = targetEntry;
          delete targetEntry.devDependencies;
          // 内联包按运行时发布物瘦身：npm 对 project 内 file: 目标按内嵌包校验，
          // devDependencies 会参与 lock 同步检查——剥离后与 --omit=dev 安装语义一致
          const vendorPkgPath = '.staging/mc-schemas/package.json';
          const vendorPkg = JSON.parse(fs.readFileSync(vendorPkgPath, 'utf8'));
          delete vendorPkg.devDependencies;
          delete vendorPkg.scripts;
          fs.writeFileSync(vendorPkgPath, JSON.stringify(vendorPkg, null, 2) + '\n');
          fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');
          console.log('依赖路径重写完成: file:../mc-schemas -> file:./mc-schemas');
          EOF

      # 模拟用户解包后的安装流程，防止再次发布「安装全绿但服务无法启动」的产物
      - name: 发布前 sanity check
        run: |
          cd .staging
          npm ci --omit=dev
          node -e "const schemas = require('@mc-commander/schemas'); const keys = Object.keys(schemas); if (!keys.length) throw new Error('schemas 加载为空对象'); console.log('sanity check 通过: @mc-commander/schemas 加载成功，' + keys.length + ' 个导出')"

      # 资产名不含 tag：部署脚本用 releases/latest/download/<asset> 取最新版，
      # 该地址无法预知 tag，故名字必须固定
      - name: 打包 tarball
        run: |
          tar -czf mc-commander-server.tar.gz \
            --exclude=node_modules --exclude=data --exclude=backups --exclude=servers --exclude=.env \
            -C .staging .

      - name: 产物敏感排除自检
        run: |
          LEAKS=$(tar -tzf mc-commander-server.tar.gz | grep -E '(^|/)(node_modules|data|backups|servers|\.env)(/|$)' || true)
          if [ -n "$LEAKS" ]; then
            echo "发现敏感路径进入发布产物："
            echo "$LEAKS"
            exit 1
          fi
          echo '敏感排除自检通过'

      - name: 生成 SHA256SUMS
        run: sha256sum mc-commander-server.tar.gz > SHA256SUMS.txt

      # 发布分三步，顺序不可换：draft 阶段上传（不受 immutable 约束）→ 全部资产就位 → 才发布。
      # 一旦发布，immutable 生效，资产不可增删改；若在资产未齐时发布，这个版本就永久残缺。
      # 正常路径下 release-please 已建好 draft release；补跑路径可能连 release 都没有，先补建。
      - name: 确保 Release 存在
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG_REF" >/dev/null 2>&1; then
            echo "Release $TAG_REF 已存在"
          else
            echo "Release $TAG_REF 不存在，补建 draft"
            gh release create "$TAG_REF" \
              --draft \
              --title "$TAG_REF" \
              --notes "由 release.yml 兜底创建，见 CHANGELOG.md"
          fi

      # --clobber 让重试可覆盖上次半途上传的资产
      - name: 上传产物到 draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG_REF" mc-commander-server.tar.gz SHA256SUMS.txt --clobber

      - name: 发布（draft → published）
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG_REF" --draft=false --latest

  # Gitee 镜像产物同步（国内用户下载出路）
  # 为什么是兄弟 job 而不是 on: release 触发的独立工作流：本 job 的上游 build 用
  # ${{ github.token }} 执行 gh release edit，而「用 GITHUB_TOKEN 执行的动作所触发的事件
  # 不会创建新的 workflow run」（GitHub 防递归机制）⇒ on: release 永远不会被触发。
  # 必须同 run 内接续，且在 build 之后（资产刚发布、同源可取）。
  #
  # 失败隔离：build 不 needs 本 job，故 build 的结论在本 job 开始前就已定稿——
  # Gitee 侧任何失败在结构上都不可能阻断 GitHub 发布；continue-on-error 让它不把 run 标红
  # （避免误判成「发布失败」而重跑，重跑在 Immutable Releases 下是危险的）。
  sync-gitee:
    name: 同步产物到 Gitee Release
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    # 三件事：
    # ① always() 必需——默认「上游被跳过则下游也跳过」，而 sync_only 路径下 build 正是被跳过的，
    #    不加就永远补不上产物；
    # ② 但只接受 success 或 skipped：build 真失败时不同步，否则会把一个残缺版本的产物推出去；
    # ③ 限本仓库，fork 与未配置场景不噪声失败（job 内还有 token 空值静默跳过）。
    if: ${{ always() && github.repository == 'wyyfzb/mc-commander' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    permissions:
      contents: read # 只读 GitHub：产物从本仓库 Release 取，最小权限
    env:
      TAG_REF: ${{ inputs.tag || github.ref_name }}
      GITEE_OWNER: wyyfzb
      GITEE_REPO: mc-commander
      # 资产名与 release.yml 打包步骤保持一致
      ASSETS: mc-commander-server.tar.gz SHA256SUMS.txt
    steps:
      - name: 检查 GITEE_TOKEN 是否配置
        id: cfg
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::notice::未配置 GITEE_TOKEN，跳过 Gitee 同步（GitHub 发布不受影响）"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      # Gitee 的仓库镜像有滞后（最小同步间隔数分钟），tag 未到就建 release 会失败。
      # 轮询而非固定 sleep：多数情况下几秒内就绪，避免白等。
      - name: 等待 Gitee 侧 tag 同步
        if: steps.cfg.outputs.skip != '1'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            if curl -sS --max-time 20 -H "Authorization: token $GITEE_TOKEN" \
                 "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/tags?per_page=100" \
               | grep -qF "\"name\":\"$TAG_REF\""; then
              echo "Gitee 侧 tag $TAG_REF 已就绪"
              exit 0
            fi
            echo "等待 tag 同步… ($i/30)"
            sleep 60
          done
          echo "::warning::等待 30 分钟仍未在 Gitee 看到 tag $TAG_REF，本次不同步"
          exit 1

      - name: 同步产物与摘要到 Gitee Release
        if: steps.cfg.outputs.skip != '1'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          AUTH="Authorization: token $GITEE_TOKEN"
          # Gitee 的 API 与附件接口都会抖动，而 GitHub 给 run: 的默认 shell 是 `bash -e`：
          # 任何一处没 guard 的 curl 失败都会让脚本**带着裸退出码死在半路、且不留消息**
          # （实测过一次 `Process completed with exit code 28`，零消息，镜像只更新到一半）。
          # 故统一带重试，并按「必须成功 / 尽力而为」分别显式处理。
          RETRY=(--retry 2 --retry-delay 5 --retry-all-errors)

          # 取 release：存在则复用其 id，不存在才创建。
          # 必须复用而非「存在就跳过」——已存在的 release 可能一个附件都没有
          # （例如手工占位建的），跳过会让这个版本永远缺产物。
          # || true：查询失败与「真的没有」都落到空串，随后按空串走创建/报错分支，
          # 不把一次 API 抖动升级成裸退出码
          RID=$(curl -sS "${RETRY[@]}" --max-time 30 -H "$AUTH" "$API/releases/tags/$TAG_REF" \
                | jq -r 'if type=="object" and .id then .id else empty end' || true)

          if [ -z "$RID" ]; then
            echo "→ Gitee 侧无 $TAG_REF 的 release（或查询失败），尝试创建"
            RID=$(curl -sS "${RETRY[@]}" --max-time 30 -X POST -H "$AUTH" \
                    --data-urlencode "tag_name=$TAG_REF" \
                    --data-urlencode "name=$TAG_REF" \
                    --data-urlencode "body=详见仓库根 CHANGELOG.md 对应版本段落。" \
                    --data-urlencode "target_commitish=main" \
                    "$API/releases" | jq -r '.id // empty' || true)
          else
            # 已存在则修正占位名（手工建的可能是 "test" 之类），并保证 body 非空。
            # 这一步是装饰性的：失败只告警，不能因此中断产物同步。
            echo "→ 复用已有 release id=$RID，并规整 title"
            curl -sS "${RETRY[@]}" --max-time 30 -X PATCH -H "$AUTH" \
              --data-urlencode "name=$TAG_REF" \
              --data-urlencode "body=详见仓库根 CHANGELOG.md 对应版本段落。" \
              "$API/releases/$RID" >/dev/null \
              || echo "::warning::规整 Gitee release title 失败（与产物无关，继续）"
          fi
          [ -n "$RID" ] || { echo "::warning::未能取得 Gitee release id"; exit 1; }
          echo "Gitee release id=$RID"

          failed=0
          for f in $ASSETS; do
            # 从 GitHub Release 取资产（同 run 刚发布，同源、无跨境风险）
            curl -fsSL --retry 3 --max-time 300 -o "/tmp/$f" \
              "https://github.com/${{ github.repository }}/releases/download/$TAG_REF/$f" \
              || { echo "::warning::GitHub 侧取 $f 失败"; failed=1; continue; }

            # 幂等：同名附件先删再传（Gitee 附件可增删，重跑安全）。
            # 查不到（或查询失败）就跳过删除并如实标注，不因此中断——上传本身仍会建立附件。
            OLD=$(curl -sS "${RETRY[@]}" --max-time 30 -H "$AUTH" \
                    "$API/releases/$RID/attach_files?per_page=100" \
                  | jq -r --arg n "$f" '.[] | select(.name==$n) | .id' | head -1 || true)
            if [ -z "$OLD" ]; then
              echo "::notice::未查到同名旧附件（或查询失败），直接上传 $f"
            else
              curl -sS "${RETRY[@]}" --max-time 30 -X DELETE -H "$AUTH" \
                "$API/releases/$RID/attach_files/$OLD" >/dev/null \
                || echo "::warning::删除旧附件 $f 失败（随后上传可能因重名被拒）"
            fi

            # 上传必须自带重试：这条链路（跨境 + Gitee 附件接口）会在 300s 处超时或被 reset，
            # 实测 v0.7.3 两个附件都因此没传上去，留下一个残缺镜像。curl 默认只重试它认定的
            # 「瞬时错误」，故显式加 --retry-all-errors 覆盖超时/连接重置；幂等由上面的
            # 「先删同名附件」保证，重试不会产生重复附件。
            # --http1.1 + 关掉 Expect: 100-continue 针对实测签名：大 body 的 multipart POST 会
            # 「300s 后 0 字节收到」（连响应都没开始），而同一时刻 93B 的小附件能传上去。
            # curl 对大 body 会先发 Expect: 100-continue 等应答，配 HTTP/2 在跨境链路上容易卡死。
            curl -fsS --max-time 300 --http1.1 -H "Expect:" \
              --retry 3 --retry-delay 5 --retry-all-errors \
              -X POST -H "$AUTH" -F "file=@/tmp/$f" "$API/releases/$RID/attach_files" >/dev/null \
              || { echo "::warning::上传 $f 到 Gitee 失败"; failed=1; continue; }
            echo "✓ 已上传 $f"
          done

          # 回读校验：确认附件真的在（以 Gitee 的登记为准，不信上传时的响应）
          # 「读不到」与「附件缺失」必须分开报——列表接口同样会抖动，把读失败当成缺失会报出
          # 假缺失（判据缺失 ≠ 判据为假）。读成功才判缺失；读失败则如实说「未能核验」并让
          # 该 job 红（continue-on-error 保证它不把 run 标红，补跑走 sync_only 路径即可）。
          got=""
          for attempt in 1 2 3; do
            if files=$(curl -fsS --max-time 30 --retry 2 --retry-delay 5 --retry-all-errors \
                        -H "$AUTH" "$API/releases/$RID/attach_files?per_page=100"); then
              printf '%s' "$files" | jq -r '.[] | "  \(.name)  \(.size) bytes"'
              got=$(printf '%s' "$files" | jq -r '.[].name' | sort | tr '\n' ' ')
              break
            fi
            echo "::warning::回读 Gitee 附件列表失败（第 $attempt 次）"
            sleep 5
          done
          if [ -z "$got" ]; then
            echo "::warning::无法回读 Gitee 附件列表 ⇒ 本次**未核验**（不是「附件缺失」）"
            exit 1
          fi
          echo "Gitee 附件: $got"

          for f in $ASSETS; do
            echo "$got" | grep -qF "$f" || { echo "::warning::Gitee 侧缺少 $f"; failed=1; }
          done
          exit $failed

      # 同步完成即回读校验下载可达性：用真实下载路径而非 API，
      # 因为 API 有附件 ≠ 用户能下载（Gitee 的下载会 302 到带签名的 CDN）
      - name: 校验 Gitee 下载路径可达
        if: steps.cfg.outputs.skip != '1'
        run: |
          # 同样加重试：这条软校验只 warn 不红，但没有重试时一次抖动会被读成「路径不可达」
          curl -fsSL --max-time 60 --retry 2 --retry-delay 5 --retry-all-errors -o /dev/null \
            "https://gitee.com/$GITEE_OWNER/$GITEE_REPO/releases/download/$TAG_REF/SHA256SUMS.txt" \
            && echo "✓ Gitee 下载路径可达" \
            || echo "::warning::Gitee 下载路径不可达（附件可能尚未就绪）"
