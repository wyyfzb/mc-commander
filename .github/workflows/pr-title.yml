# PR 标题校验（Conventional Commits）
#
# 为什么独立成 workflow：仓库只用 squash 合并，PR 标题会成为 main 上那条提交，
# 也是 release-please 唯一的解析输入。标题格式不对时它**不报错**，只是把这条改动
# 当不存在——不 bump 版本、不进 CHANGELOG，漏发没有任何信号。
#
# 不并进 ci.yml 的 hygiene job：那个 workflow 只听 push / pull_request 的默认活动类型，
# 改标题不会触发重跑，于是「标题改对了但红灯一直挂着」。这里显式监听 `edited`，
# 编辑标题即重新判定。也正因如此它**不装依赖**、只跑一个零依赖的 node 脚本。
name: PR 标题

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    name: PR 标题（Conventional Commits）
    runs-on: ubuntu-latest
    steps:
      # 只为一支零依赖脚本，不需要 npm ci
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # 标题经环境变量传入，不拼进 run 命令：标题里出现 `"`、`$`、反引号时
      # 会破坏 shell 解析（PR 标题是外部输入）
      - name: 校验标题格式
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tools/ci/check-pr-title.mjs "$PR_TITLE"
