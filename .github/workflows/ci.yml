name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # PR 内旧提交的 run 取消省资源；主干 push run 排队不取消，保每个合并点的完整验证
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  schemas:
    name: 契约包（schemas 测试 + dist 同步守卫）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    defaults:
      run:
        working-directory: mc-schemas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc-schemas/package-lock.json
      - run: npm ci
      - run: npm test
      # dist 同步守卫：dist/index.js 是服务端运行时消费物（server 经
      # file: link + main 字段解析到 dist，前端则经 vite alias 直读 src），
      # 改 src 不重建 dist 时其余 job 全绿但服务端消费陈旧契约——故对
      # 提交版 dist 做重建 byte 级比对，漂移即红（本地与 CI 均验证过
      # rolldown 确定性输出，跨环境不一致时改用「重建产物参与测试」等价守卫）
      - name: dist 同步守卫（重建产物与提交版 byte 级比对）
        run: |
          cp dist/index.js "$RUNNER_TEMP/dist-committed.js"
          npm run build
          if ! cmp -s "$RUNNER_TEMP/dist-committed.js" dist/index.js; then
            echo "::error file=mc-schemas/dist/index.js::提交的 dist 与 src 重建产物不一致——改 src 后必须 npm run build 并一并提交 dist（服务端运行时消费 dist）"
            diff "$RUNNER_TEMP/dist-committed.js" dist/index.js | head -20 || true
            exit 1
          fi

  server:
    name: 服务端（lint + test）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    defaults:
      run:
        working-directory: mc_commander_server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc_commander_server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v7
        with:
          name: coverage-server
          path: mc_commander_server/coverage/coverage-final.json
          retention-days: 7

  web-check:
    name: 前端（lint + test）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    defaults:
      run:
        working-directory: mc_manager_web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc_manager_web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      # 设计 token 守门（色板类/dark:/transition-all/动效/圆角 + 对比度）——与 lint/test 并列拦截
      - run: npm run check:design-tokens
      - run: npm run check:contrast
      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: mc_manager_web/coverage/coverage-final.json
          retention-days: 7

  coverage-gate:
    name: 覆盖率门禁（≥ 70%）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    needs: [server, web-check]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 下载覆盖率产物
        uses: actions/download-artifact@v7
        with:
          path: coverage-artifacts
      - name: 汇总两份覆盖率并与阈值比较
        run: node scripts/check-coverage-gate.mjs coverage-artifacts/coverage-web/coverage-final.json coverage-artifacts/coverage-server/coverage-final.json 70

  web-e2e:
    name: 前端（build + e2e）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    defaults:
      run:
        working-directory: mc_manager_web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc_manager_web/package-lock.json
      - run: npm ci
      # build 内含 tsc -b（类型检查），产物供 preview e2e 复用（E2E_SERVER=preview）
      - run: npm run build
      # 首屏/路由首访体积门禁（gzip）：复用上面的构建产物，拦截重依赖回流高频路由
      - run: npm run check:size
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('mc_manager_web/package-lock.json') }}
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          E2E_SERVER: preview
      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: mc_manager_web/playwright-report/
          retention-days: 7

  # 敏感信息扫描（PR 与主干推送）
  gitleaks:
    name: 密钥泄漏扫描
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
