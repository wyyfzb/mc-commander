name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # PR 内旧提交的 run 取消省资源；主干 push run 排队不取消，保每个合并点的完整验证
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 仓库级静态检查合成一个 job：格式与密钥扫描都是全仓扫描、都不需要装三个包的依赖，
  # 拆成两个 job 只是各多付一次 checkout + setup-node + npm ci。gitleaks 需全量历史故 fetch-depth: 0
  hygiene:
    name: 仓库卫生（代码格式 + 密钥泄漏扫描）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # workspace 根（安装一次覆盖三包 + Biome）。
      # 只查 formatter，不含 lint——lint 由下方各包的 oxlint job 承担；
      # 格式化范围与排除项（dist/public/coverage/e2e 产物/.ai/锁文件，以及 CSS 与 Markdown）
      # 见 biome.jsonc。失败时本地执行 `npm run format` 即修复。
      - run: npm run format:check
      # 目录结构门禁：顶层白名单 + 源码面无测试 + 运行期产物不入库（判据见 tools/check-layout.mjs）。
      - run: npm run check:layout
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 生产依赖漏洞门禁：只读 lock 文件，不需要 node_modules 也不需要 npm ci
  # （实测 npm audit 仅凭 package.json + package-lock.json 即可判定），故独立成 job
  # 只要一次 checkout，不与三个包 job 争 setup-node 的缓存。
  # 只判生产依赖（--omit=dev）：devDependencies 不进产物，其 advisory 不构成上线风险；
  # 阈值取 high（实测 --audit-level=high 对仅 moderate 的样本 exit 0、moderate 档 exit 1），
  # 留出 moderate/low 的处置余量，避免上游发 advisory 时无关 PR 被红灯堵住。
  # 三包任一有 high 及以上即失败。
  dependency-audit:
    name: 生产依赖漏洞门禁（npm audit --omit=dev）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 三包生产依赖零高危
        run: |
          failed=0
          for pkg in apps/schemas apps/server apps/web; do
            echo "::group::$pkg"
            if ! (cd "$pkg" && npm audit --omit=dev --audit-level=high); then
              echo "::error file=$pkg/package-lock.json::$pkg 存在 high 及以上生产依赖漏洞——本地执行 (cd $pkg && npm audit fix) 处置"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  schemas:
    name: 契约包（lint + schemas 测试 + 构建产物）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run lint -w apps/schemas
      # 覆盖率阈值配在 vitest.config.js，由各包自己判——不汇总到单独 job，
      # 合计判阈值会让一个包掉到 30%、另一个 95% 也照样通过
      - run: npm run test:coverage -w apps/schemas
      # 契约包产物是消费前置（服务端经 workspace 链接解析到 dist/index.js）。
      # dist 不入库（构建产物），故此处构建并断言产物存在——取代原先「与提交版逐字节
      # 比对」：不再有可漂移的提交产物，服务端也不可能吃到陈旧契约。
      - name: 构建契约包并断言产物存在
        working-directory: apps/schemas
        run: |
          npm run build
          if [ ! -f dist/index.js ]; then
            echo "::error file=apps/schemas/package.json::构建未产出 dist/index.js"
            exit 1
          fi
          echo "dist/index.js 已构建：$(wc -c < dist/index.js) 字节"

  server:
    name: 服务端（lint + test）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # workspace 根一次安装（根 lock 是唯一事实源）
      - run: npm ci
        working-directory: .
        # 服务端经 workspace 链接消费契约包产物（main → apps/schemas/dist/index.js），
        # 故先建 dist——这一步就是「服务端不会吃到陈旧契约」的 CI 保证
      - run: npm run build -w apps/schemas
      - run: npm run lint -w apps/server
      - run: npm run test:coverage -w apps/server

  web-check:
    name: 前端（lint + test）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # workspace 根一次安装（根 lock 是唯一事实源）
      - run: npm ci
        working-directory: .
      - run: npm run lint -w apps/web
      - run: npm run test:coverage -w apps/web
      # 设计 token 守门（色板类/dark:/transition-all/动效/圆角 + 对比度）——与 lint/test 并列拦截
      - run: npm run check:design-tokens -w apps/web
      - run: npm run check:contrast -w apps/web

  web-e2e:
    name: 前端（build + e2e）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      # build 内含 tsc -b（类型检查），产物供 preview e2e 复用（E2E_SERVER=preview）
      - run: npm run build -w apps/web
      # 首屏/路由首访体积门禁（gzip）：复用上面的构建产物，拦截重依赖回流高频路由
      - run: npm run check:size -w apps/web
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e -w apps/web
        env:
          E2E_SERVER: preview
      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
