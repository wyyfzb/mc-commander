name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # PR 内旧提交的 run 取消省资源；主干 push run 排队不取消，保每个合并点的完整验证
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: 服务端（lint + test）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    defaults:
      run:
        working-directory: mc_commander_server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc_commander_server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v7
        with:
          name: coverage-server
          path: mc_commander_server/coverage/coverage-final.json
          retention-days: 7

  web-check:
    name: 前端（lint + test）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    defaults:
      run:
        working-directory: mc_manager_web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc_manager_web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      # 设计 token 守门（色板类/dark:/transition-all/动效/圆角 + 对比度）——与 lint/test 并列拦截
      - run: npm run check:design-tokens
      - run: npm run check:contrast
      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: mc_manager_web/coverage/coverage-final.json
          retention-days: 7

  coverage-gate:
    name: 覆盖率门禁（≥ 65%）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    needs: [server, web-check]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 下载覆盖率产物
        uses: actions/download-artifact@v7
        with:
          path: coverage-artifacts
      - name: 汇总两份覆盖率并与阈值比较
        run: node scripts/check-coverage-gate.mjs coverage-artifacts/coverage-web/coverage-final.json coverage-artifacts/coverage-server/coverage-final.json 65

  web-e2e:
    name: 前端（build + e2e）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    defaults:
      run:
        working-directory: mc_manager_web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc_manager_web/package-lock.json
      - run: npm ci
      # build 内含 tsc -b（类型检查），产物供 preview e2e 复用（E2E_SERVER=preview）
      - run: npm run build
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('mc_manager_web/package-lock.json') }}
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          E2E_SERVER: preview
      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: mc_manager_web/playwright-report/
          retention-days: 7

  # 敏感信息扫描（PR 与主干推送）
  gitleaks:
    name: 密钥泄漏扫描
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
