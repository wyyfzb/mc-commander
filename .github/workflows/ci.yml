name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # PR 内旧提交的 run 取消省资源；主干 push run 排队不取消，保每个合并点的完整验证
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 默认最小权限：仓库默认的 GITHUB_TOKEN 是读写全开，CI 里只有读代码的需求。
# 需要写权的作用域在各 job 里单独声明，不在此处放宽。
permissions:
  contents: read

jobs:
  # 仓库级静态检查合成一个 job：格式与密钥扫描都是全仓扫描、都不需要装三个包的依赖，
  # 拆成两个 job 只是各多付一次 checkout + setup-node + npm ci。gitleaks 需全量历史故 fetch-depth: 0
  hygiene:
    name: 仓库卫生（代码格式 + 密钥泄漏扫描）
    runs-on: ubuntu-latest
    # gitleaks-action 命中时在 PR 上发评论，需 pull-requests: write
    permissions:
      contents: read
      pull-requests: write
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # workspace 根（安装一次覆盖三包 + Biome）。
      # 只查 formatter，不含 lint——lint 由下方各包的 oxlint job 承担；
      # 格式化范围与排除项（dist/public/coverage/e2e 产物/.ai/锁文件，以及 CSS 与 Markdown）
      # 见 biome.jsonc。失败时本地执行 `npm run format` 即修复。
      - run: npm run format:check
      # 目录结构门禁：顶层白名单 + 源码面无测试 + 运行期产物不入库（判据见 tools/check-layout.mjs）。
      - run: npm run check:layout
      # 工具链自身的门禁：tools/ 在 workspaces 之外，包级 lint / tsc / vitest 都扫不到它
      # （三个 job 走 -w 调用），故在此显式跑，否则这里的错漏不会有任何信号。
      - run: npm run lint:tools
      - run: npm run typecheck
      - run: npm run test:tools
      # 密钥扫描排在 workflow 检查之前：它判的是泄露，比语法问题更该先拿到结论，
      # 不该被前一步的失败跳过。
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # workflow 文件自身的语法与表达式检查：写错只有触发时才暴露，而发布链路的错
      # 会在「正要发版」那一刻现形。版本钉死，避免上游更新让门禁行为漂移。
      - name: workflow 语法检查（actionlint）
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          if ! out=$(/tmp/actionlint 2>&1); then
            # 首个错误压成 annotation：日志与检查状态走不同域名取值，
            # annotation 能随检查状态一起读到，排障不必先去取日志
            echo "::error::$(printf '%s' "$out" | head -4 | tr '\n' ' ')"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "${out:-actionlint: 全部 workflow 通过}"

  # 生产依赖漏洞门禁：只读 lock 文件，不需要 node_modules 也不需要 npm ci
  # （实测 npm audit 仅凭 package.json + package-lock.json 即可判定），故独立成 job
  # 只要一次 checkout，不与三个包 job 争 setup-node 的缓存。
  # 只判生产依赖（--omit=dev）：devDependencies 不进产物，其 advisory 不构成上线风险；
  # 阈值取 high（实测 --audit-level=high 对仅 moderate 的样本 exit 0、moderate 档 exit 1），
  # 留出 moderate/low 的处置余量，避免上游发 advisory 时无关 PR 被红灯堵住。
  # 三包任一有 high 及以上即失败。
  dependency-audit:
    name: 生产依赖漏洞门禁（npm audit --omit=dev）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 三包生产依赖零高危
        run: |
          failed=0
          # 逐包跑而非在根跑一次：npm audit 按 cwd 解析依赖子树，包级调用只见该包的生产依赖
          # （实测 schemas 子树 1 条链 / web 590 条链，dompurify 这类只在 web 出现），
          # 报错时能直接指向是哪个包拖进来的。
          for pkg in apps/schemas apps/server apps/web; do
            echo "::group::$pkg"
            if ! (cd "$pkg" && npm audit --omit=dev --audit-level=high); then
              # file= 必须指真实存在的文件：单 lock 后包内无 package-lock.json，
              # 指它会生成指向幽灵路径的注解，看的人按图索骥只会扑空。
              echo "::error file=package-lock.json::$pkg 存在 high 及以上生产依赖漏洞——在仓库根执行 npm audit fix 后重建 lock（加 --registry=https://registry.npmjs.org）"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  schemas:
    name: 契约包（lint + schemas 测试 + 构建产物）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run lint -w apps/schemas
      # 覆盖率阈值配在 vitest.config.js，由各包自己判——不汇总到单独 job，
      # 合计判阈值会让一个包掉到 30%、另一个 95% 也照样通过
      - run: npm run test:coverage -w apps/schemas
      # 契约包产物是消费前置（服务端经 workspace 链接解析到 dist/index.js）。
      # dist 不入库（构建产物），故此处构建并断言产物存在：提交产物会漂移，
      # 服务端也可能吃到陈旧契约。
      - name: 构建契约包并断言产物存在
        working-directory: apps/schemas
        run: |
          npm run build
          if [ ! -f dist/index.js ]; then
            echo "::error file=apps/schemas/package.json::构建未产出 dist/index.js"
            exit 1
          fi
          echo "dist/index.js 已构建：$(wc -c < dist/index.js) 字节"

  server:
    name: 服务端（lint + test）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # workspace 根一次安装（根 lock 是唯一事实源）
      - run: npm ci
        working-directory: .
        # 服务端经 workspace 链接消费契约包产物（main → apps/schemas/dist/index.js），
        # 故先建 dist——这一步就是「服务端不会吃到陈旧契约」的 CI 保证
      - run: npm run build -w apps/schemas
      - run: npm run lint -w apps/server
      - run: npm run test:coverage -w apps/server

  web-check:
    name: 前端（lint + test）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # workspace 根一次安装（根 lock 是唯一事实源）
      - run: npm ci
        working-directory: .
      - run: npm run lint -w apps/web
      - run: npm run test:coverage -w apps/web
      # 设计 token 守门（色板类/dark:/transition-all/动效/圆角 + 对比度）——与 lint/test 并列拦截
      # 探针住 tools/gates/（工具链层），判定对象固定在 apps/web——扫错树会自动红，见 lib/web-root.mjs
      - run: npm run check:design-tokens
      - run: npm run check:contrast

  web-e2e:
    name: 前端（build + e2e）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      # build 内含 tsc -b（类型检查），产物供 preview e2e 复用（E2E_SERVER=preview）
      - run: npm run build -w apps/web
      # 首屏/路由首访体积门禁（gzip）：复用上面的构建产物，拦截重依赖回流高频路由
      - run: npm run check:size
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # 依赖唯一事实源是根 lock；指包内 lock（该文件不存在）会让缓存恒 miss
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          E2E_SERVER: preview
      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tools/e2e/playwright-report/
          retention-days: 7
