name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # PR 内旧提交的 run 取消省资源；主干 push run 排队不取消，保每个合并点的完整验证
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 仓库级静态检查合成一个 job：格式与密钥扫描都是全仓扫描、都不需要装三个包的依赖，
  # 拆成两个 job 只是各多付一次 checkout + setup-node + npm ci。gitleaks 需全量历史故 fetch-depth: 0
  hygiene:
    name: 仓库卫生（代码格式 + 密钥泄漏扫描）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # 仓库级工具包（根 package.json 只装 Biome，不是 workspace 根）。
      # 只查 formatter，不含 lint——lint 由下方各包的 oxlint job 承担；
      # 格式化范围与排除项（dist/public/coverage/e2e 产物/.ai/锁文件，以及 CSS 与 Markdown）
      # 见 biome.jsonc。失败时本地执行 `npm run format` 即修复。
      - run: npm run format:check
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 生产依赖漏洞门禁：只读 lock 文件，不需要 node_modules 也不需要 npm ci
  # （实测 npm audit 仅凭 package.json + package-lock.json 即可判定），故独立成 job
  # 只要一次 checkout，不与三个包 job 争 setup-node 的缓存。
  # 只判生产依赖（--omit=dev）：devDependencies 不进产物，其 advisory 不构成上线风险；
  # 阈值取 high（实测 --audit-level=high 对仅 moderate 的样本 exit 0、moderate 档 exit 1），
  # 留出 moderate/low 的处置余量，避免上游发 advisory 时无关 PR 被红灯堵住。
  # 三包任一有 high 及以上即失败。
  dependency-audit:
    name: 生产依赖漏洞门禁（npm audit --omit=dev）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 三包生产依赖零高危
        run: |
          failed=0
          for pkg in mc-schemas mc_commander_server mc_manager_web; do
            echo "::group::$pkg"
            if ! (cd "$pkg" && npm audit --omit=dev --audit-level=high); then
              echo "::error file=$pkg/package-lock.json::$pkg 存在 high 及以上生产依赖漏洞——本地执行 (cd $pkg && npm audit fix) 处置"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  schemas:
    name: 契约包（lint + schemas 测试 + dist 同步守卫）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    defaults:
      run:
        working-directory: mc-schemas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc-schemas/package-lock.json
      - run: npm ci
      - run: npm run lint
      # 覆盖率阈值配在 vitest.config.js，由各包自己判——不汇总到单独 job，
      # 合计判阈值会让一个包掉到 30%、另一个 95% 也照样通过
      - run: npm run test:coverage
      # dist 同步守卫：dist/index.js 是服务端运行时消费物（server 经
      # file: link + main 字段解析到 dist，前端则经 vite alias 直读 src），
      # 改 src 不重建 dist 时其余 job 全绿但服务端消费陈旧契约——故对
      # 提交版 dist 做重建 byte 级比对，漂移即红（本地与 CI 均验证过
      # rolldown 确定性输出，跨环境不一致时改用「重建产物参与测试」等价守卫）
      - name: dist 同步守卫（重建产物与提交版 byte 级比对）
        run: |
          cp dist/index.js "$RUNNER_TEMP/dist-committed.js"
          npm run build
          if ! cmp -s "$RUNNER_TEMP/dist-committed.js" dist/index.js; then
            echo "::error file=mc-schemas/dist/index.js::提交的 dist 与 src 重建产物不一致——改 src 后必须 npm run build 并一并提交 dist（服务端运行时消费 dist）"
            diff "$RUNNER_TEMP/dist-committed.js" dist/index.js | head -20 || true
            exit 1
          fi

  server:
    name: 服务端（lint + test）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    defaults:
      run:
        working-directory: mc_commander_server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc_commander_server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage

  web-check:
    name: 前端（lint + test）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    defaults:
      run:
        working-directory: mc_manager_web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc_manager_web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      # 设计 token 守门（色板类/dark:/transition-all/动效/圆角 + 对比度）——与 lint/test 并列拦截
      - run: npm run check:design-tokens
      - run: npm run check:contrast

  web-e2e:
    name: 前端（build + e2e）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    defaults:
      run:
        working-directory: mc_manager_web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc_manager_web/package-lock.json
      - run: npm ci
      # build 内含 tsc -b（类型检查），产物供 preview e2e 复用（E2E_SERVER=preview）
      - run: npm run build
      # 首屏/路由首访体积门禁（gzip）：复用上面的构建产物，拦截重依赖回流高频路由
      - run: npm run check:size
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('mc_manager_web/package-lock.json') }}
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          E2E_SERVER: preview
      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: mc_manager_web/playwright-report/
          retention-days: 7
