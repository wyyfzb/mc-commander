name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 服务端（lint + test）
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    defaults:
      run:
        working-directory: mc_commander_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc_commander_server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  web:
    name: 前端（lint + typecheck + test + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mc_manager_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc_manager_web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test
      - run: npm run build

  e2e:
    name: 前端 e2e（Playwright）
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: mc_manager_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc_manager_web/package-lock.json
      - run: npm ci
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('mc_manager_web/package-lock.json') }}
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: mc_manager_web/playwright-report/
          retention-days: 7

  # 敏感信息扫描（PR 与主干推送）
  gitleaks:
    name: 密钥泄漏扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
